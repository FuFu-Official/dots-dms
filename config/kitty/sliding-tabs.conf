# Loaded after DMS colors: style stays local, colors stay in dank-tabs.conf.
tab_bar_style custom
tab_bar_edge bottom
tab_bar_align left
tab_bar_min_tabs 2
# The last cell carries shader metadata, so the grid must reach the right edge.
tab_bar_margin_width 0
tab_bar_margin_height 6 0
tab_bar_margin_color none
active_tab_font_style normal
inactive_tab_font_style normal
tab_separator ""
tab_title_template " {index} {bell_symbol}{activity_symbol}{title[:30]}{title[30:] and '…'} "
active_tab_title_template none
custom_shaders active-tab-slide-lite
